[package]
name = "zarrs-python"
version = "0.2.3"
edition = "2024"
publish = false

[lib]
name = "zarrs_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["abi3-py311"] }
# BENCHMARK-ONLY BUILD: zarrs perf/direct_b2b_decode (main 2026-10-04 + 6 commits); no HTTP or
# obstore stores, whose adapters need zarrs_storage 0.4.
zarrs = { git = "https://github.com/zarrs/zarrs", rev = "2a9a113cca3c828ebf2796102db021f72eac0c8c", features = ["async", "zlib", "pcodec", "bz2"] }
rayon_iter_concurrent_limit = "0.2.0"
rayon = "1.10.0"
# fix for https://stackoverflow.com/questions/76593417/package-openssl-was-not-found-in-the-pkg-config-search-path
openssl = { version = "0.10", features = ["vendored"] }
numpy = "0.27.0"
unsafe_cell_slice = "0.2.0"
serde_json = "1.0.128"
pyo3-stub-gen = "0.17.1"
tokio = { version = "1.41.1", features = ["rt-multi-thread"] }
itertools = "0.14.0"
bytemuck = { version = "1.24.0", features = ["must_cast"] }

[profile.release]
lto = true
