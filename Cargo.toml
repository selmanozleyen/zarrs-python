[package]
name = "zarrs-python"
version = "0.2.3"
edition = "2024"
publish = false

[lib]
name = "zarrs_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["abi3-py311"] }
# ON THE 0.24 RELEASE: replace this line with
#     zarrs = { version = "0.24", features = ["async", "zlib", "pcodec", "bz2"] }
# and delete the [patch.crates-io] block at the end of this file. Nothing in src/ changes:
# it already compiles against 0.24's API. The rev is pinned rather than tracking a branch so
# that a build is reproducible from the manifest alone.
zarrs = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7", features = ["async", "zlib", "pcodec", "bz2"] }
rayon_iter_concurrent_limit = "0.2.0"
crossbeam-channel = "0.5"  # MPMC: readers drain the job queue, decoders the decode queue
rayon = "1.10.0"
# fix for https://stackoverflow.com/questions/76593417/package-openssl-was-not-found-in-the-pkg-config-search-path
openssl = { version = "0.10", features = ["vendored"] }
numpy = "0.27.0"
unsafe_cell_slice = "0.2.0"
serde_json = "1.0.128"
pyo3-stub-gen = "0.17.1"
opendal = { version = "0.55.0", features = ["services-http"] }
tokio = { version = "1.41.1", features = ["rt-multi-thread"] }
zarrs_opendal = "0.10.0"
itertools = "0.14.0"
bytemuck = { version = "1.24.0", features = ["must_cast"] }
pyo3-object_store = "0.7.0" # object_store 0.12
zarrs_object_store = "0.5.0" # object_store 0.12

[profile.release]
lto = true

# ON THE 0.24 RELEASE: delete this whole block, once zarrs_opendal and zarrs_object_store have
# been tagged against zarrs 0.24. Until then it is load-bearing, not cosmetic -- without it six
# trait bounds are unsatisfiable and the crate does not build.
#
# zarrs_opendal and zarrs_object_store are separate repositories tracking RELEASED zarrs, so
# they pull zarrs_storage from crates.io while zarrs comes from git -- two versions of the
# same crate, hence two distinct AsyncReadableStorageTraits, hence trait bounds that cannot
# be satisfied. Patched to the same rev so there is one. Pinned by rev, never by path: the
# build refuses a path patch because it would resolve to whatever a directory happened to
# hold, which no commit records.
[patch.crates-io]
zarrs_storage = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7" }
zarrs_metadata = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7" }
zarrs_metadata_ext = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7" }
zarrs_plugin = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7" }
zarrs_data_type = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7" }
zarrs_filesystem = { git = "https://github.com/zarrs/zarrs", rev = "c17fe374b1fa7df8373b6c6f6eb3f1d33c3a3bd7" }
