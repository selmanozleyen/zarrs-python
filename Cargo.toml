[package]
name = "zarrs-python"
version = "0.2.3"
edition = "2024"
publish = false

[lib]
name = "zarrs_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["abi3-py311"] }
zarrs = { version = "0.23.6", features = ["async", "zlib", "pcodec", "bz2"] }
rayon_iter_concurrent_limit = "0.2.0"
rayon = "1.10.0"
# fix for https://stackoverflow.com/questions/76593417/package-openssl-was-not-found-in-the-pkg-config-search-path
openssl = { version = "0.10", features = ["vendored"] }
numpy = "0.27.0"
unsafe_cell_slice = "0.2.0"
serde_json = "1.0.128"
pyo3-stub-gen = "0.17.1"
opendal = { version = "0.55.0", features = ["services-http"] }
tokio = { version = "1.41.1", features = ["rt-multi-thread"] }
zarrs_opendal = "0.10.0"
itertools = "0.14.0"
lru = "0.16.4"
bytemuck = { version = "1.24.0", features = ["must_cast"] }
pyo3-object_store = "0.7.0" # object_store 0.12
zarrs_object_store = "0.5.0" # object_store 0.12

# Target-gated because io-uring 0.7 does not build on darwin at all -- it reaches for
# MAP_POPULATE, cpu_set_t and SYS_io_uring_setup, none of which exist in libc there. And gated
# again at RUNTIME in io_pool, because "the kernel has io_uring" and "this process may create a
# ring" are different questions: LRZ AI allows it (`kernel.io_uring_disabled=0`) while the HMGU
# cluster refuses with EPERM (`=2`).
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
# For POSIX_FADV_WILLNEED and the page size the hint phase aligns to. Already in the tree as a
# transitive dependency; named here because this crate now calls it directly.
libc = "0.2"

[profile.release]
lto = true
