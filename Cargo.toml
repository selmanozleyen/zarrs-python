[package]
name = "zarrs-python"
version = "0.2.3"
edition = "2024"
publish = false

[lib]
name = "zarrs_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["abi3-py311"] }
zarrs = { version = "0.23.6", features = ["async", "zlib", "pcodec", "bz2"] }
# already in the tree via zarrs and zarrs_filesystem
lru = "0.16"
rayon_iter_concurrent_limit = "0.2.0"
rayon = "1.10.0"
# fix for https://stackoverflow.com/questions/76593417/package-openssl-was-not-found-in-the-pkg-config-search-path
openssl = { version = "0.10", features = ["vendored"] }
numpy = "0.27.0"
unsafe_cell_slice = "0.2.0"
serde_json = "1.0.128"
pyo3-stub-gen = "0.17.1"
opendal = { version = "0.55.0", features = ["services-http"] }
tokio = { version = "1.41.1", features = ["rt-multi-thread"] }
zarrs_opendal = "0.10.0"
itertools = "0.14.0"
bytemuck = { version = "1.24.0", features = ["must_cast"] }
pyo3-object_store = "0.7.0" # object_store 0.12
zarrs_object_store = "0.5.0" # object_store 0.12

[profile.release]
lto = true

# The blosc block-dedup gate lives in the zarrs crate, not here, so the crate has to
# come from a checkout rather than the registry. build_venv.sh places that checkout at
# this path and refuses to build if it is missing -- a patch that silently resolved
# from crates.io would build stock zarrs while the run claimed the branch.
[patch.crates-io]
# The blosc block-dedup gate lives in the zarrs crate, not here. Pinned by commit
# rather than by a path: the rev is then part of this file, and this file is part of
# the history, so a build cannot drift with whatever happens to sit in a checkout
# directory. That commit also strips the `path` from zarrs' workspace dependency
# entries, so the sibling crates resolve from crates.io exactly as they do for the
# released 0.23.6 -- keeping them local pins them at the tag's versions, which splits
# zarrs_storage in two and leaves zarrs_filesystem too old for file_handle_cache_size.
zarrs = { git = "https://github.com/selmanozleyen/zarrs", rev = "1c62f01ccd8de88ce59cf7e7e6343089ade27786" }
